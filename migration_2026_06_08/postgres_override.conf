# /etc/systemd/system/postgresql@17-main.service.d/override.conf
# Auto-heal the storedata DB after a crash/OOM (was Restart=no → 5h outage 2026-06-16).
# RestartSec gives the box a moment; StartLimit prevents a tight crash-loop from
# thrashing (>=5 failures in 5min → give up so the operator is alerted).
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10
# Make the OOM killer prefer other processes over Postgres (lower score = safer).
OOMScoreAdjust=-600
